services:


  db:
    image: mysql:8.0
    container_name: mysql_db
    environment:
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - ./init:/docker-entrypoint-initdb.d
      - orion_db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD","mysqladmin","ping","-h","localhost"]
      timeout: 20s
      retries: 10
    networks:
      - orion-network

  eureka-server:
    build: ./eureka-server
    container_name: eureka-server
    ports:
      - "${PORT_EUREKA}:${PORT_EUREKA}"
    healthcheck:
      test: [ "CMD-SHELL", "wget -q -O /dev/null http://localhost:${PORT_EUREKA:-8761}/eureka/apps || exit 1" ]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - orion-network

  api-gateway:
    build: ./ApiGateway
    container_name: api-gateway
    ports:
      - "${PORT_GATEWAY}:${PORT_GATEWAY}"
    depends_on:
      eureka-server:
        condition: service_healthy
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: ${EUREKA_DEFAULT_ZONE}
      JWT_SECRET: ${JWT_SECRET}
    networks:
      - orion-network

  user-service:
    build: ./Usuario_Service
    container_name: users-service
    ports:
      - "${PORT_USER_SERVICE}:${PORT_USER_SERVICE}"
    depends_on:
      eureka-server:
        condition: service_healthy
      db:
        condition: service_healthy
    environment:
        SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/${DB_NAME_USERS}?allowPublicKeyRetrieval=true&useSSL=false
        SPRING_DATASOURCE_USERNAME: root
        SPRING_DATASOURCE_PASSWORD: ${DB_ROOT_PASSWORD}
        EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: ${EUREKA_DEFAULT_ZONE}
        JWT_SECRET: ${JWT_SECRET}
        JWT_EXPIRATION_TIME: ${JWT_EXPIRATION_TIME}
    networks:
      - orion-network

