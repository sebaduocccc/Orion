databaseChangeLog:
  - changeSet:
      id: 001-estructura-inicial-posts
      author: sebaduocccc
      changes:
        - createTable:
            tableName: post
            columns:
              - column: {name: id, type: bigint, autoIncrement: true, constraints: {primaryKey: true}}
              - column: {name: user_id, type: bigint}
              - column: {name: content, type: varchar(500), constraints: {nullable: false}}
              - column: {name: media_url, type: varchar(255)}
              - column: {name: creado_el, type: datetime(6), constraints: {nullable: false}}

        - createIndex:
            tableName: post
            indexName: idx_post_userid
            columns:
              - column:
                  name: user_id
