databaseChangeLog:
  - changeSet:
      id: 002-seed-posts
      author: orion-system
      changes:
        - insert:
            tableName: post
            columns:
              - column: { name: user_id, valueNumeric: 1 }
              - column: { name: content, value: "Hoy compartí mi primera fotografía de las montañas de Los Andes. El paisaje era absolutamente increíble, no hay palabras para describirlo." }
              - column: { name: media_url, value: "https://media.orion.app/posts/andes_photo_001.jpg" }
              - column: { name: creado_el, valueDate: "2026-06-01T09:15:00" }
