            tableName: post
            columns:
              - column: { name: user_id, valueNumeric: 2 }
              - column: { name: content, value: "Acabo de resolver un bug de Python que me tenía loco desde hace días. A veces el error más pequeño cuesta horas de depuración." }
              - column: { name: creado_el, valueDate: "2026-06-03T14:22:00" }
        - insert:
            tableName: post
