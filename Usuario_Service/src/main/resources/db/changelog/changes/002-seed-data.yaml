databaseChangeLog:

  - changeSet:
      id: 002-insert-permisos
      author: orion-system
      changes:
        - insert:
            tableName: permisos
            columns:
              - column: {name: id, valueNumeric: 1}
              - column: {name: nombre, value: "READ"}
        - insert:
            tableName: permisos
            columns:
              - column: {name: id, valueNumeric: 2}
              - column: {name: nombre, value: "POST"}
        - insert:
            tableName: permisos
            columns:
              - column: {name: id, valueNumeric: 3}
              - column: {name: nombre, value: "DELETE"}

  - changeSet:
      id: 003-insert-roles
      author: orion-system
      changes:
        - insert:
            tableName: roles
            columns:
              - column: {name: id, valueNumeric: 1}
              - column: {name: nombre, value: "ROLE_USER"}
        - insert:
            tableName: roles
            columns:
              - column: {name: id, valueNumeric: 2}
              - column: {name: nombre, value: "ROLE_ADMIN"}

  - changeSet:
      id: 004-insert-roles-permisos
      author: orion-system
      changes:
        # ROLE_USER (1): READ (1) + POST (2)
        - insert:
            tableName: roles_permisos
            columns:
              - column: {name: rol_id, valueNumeric: 1}
              - column: {name: permiso_id, valueNumeric: 1}
        - insert:
            tableName: roles_permisos
            columns:
              - column: {name: rol_id, valueNumeric: 1}
              - column: {name: permiso_id, valueNumeric: 2}
        # ROLE_ADMIN (2): READ (1) + POST (2) + DELETE (3)
        - insert:
            tableName: roles_permisos
            columns:
              - column: {name: rol_id, valueNumeric: 2}
              - column: {name: permiso_id, valueNumeric: 1}
        - insert:
            tableName: roles_permisos
            columns:
              - column: {name: rol_id, valueNumeric: 2}
              - column: {name: permiso_id, valueNumeric: 2}
        - insert:
            tableName: roles_permisos
            columns:
              - column: {name: rol_id, valueNumeric: 2}
              - column: {name: permiso_id, valueNumeric: 3}

