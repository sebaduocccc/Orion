spring:
  application:
    name: Usuarios

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  datasource:
    url: ${SPRING_DATASOURCE_URL}:jdbc:mysql://db:3306/usuario_db?allowPublicKeyRetrieval=true&useSSL=false
    username: ${SPRING_DATASOURCE_USERNAME}:root
    password: ${SPRING_DATASOURCE_PASSWORD}:root

  liquibase:
    enabled: false
    change-log: classpath:/db/changelog/db.changelog-master.yaml

logging:
  file:
    name: logs/usuario.log
server:
  port: 9090


jwt:
  secret: ${JWT_SECRET}
  expiration_time: ${JWT_EXPIRATION_TIME}
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://eureka-server:8761/eureka/}
  instance:
    prefer-ip-address: true